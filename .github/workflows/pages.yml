name: Deploy site to GitHub Pages

# Publishes the static site (index.html landing page + the interactive
# self-assessment tool) to GitHub Pages. Runs when the site content lands on
# main (e.g. after this PR is merged), and can also be triggered manually.
on:
  push:
    # Deploys from whichever branch ends up holding the site. `main` is the
    # conventional target; `baseline` is the current base branch (automation
    # here could not create `main`). Keep the one you settle on.
    branches: [main, baseline]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the repository root. index.html is the entry point; the tool
          # lives at tools/self-assessment.html. .nojekyll disables Jekyll so
          # files are served exactly as committed.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
